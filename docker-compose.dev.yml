# Base MySQL locale pour le développement uniquement.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autolocalize
      MYSQL_USER: autolocalize
      MYSQL_PASSWORD: autolocalize
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-dev:/var/lib/mysql

volumes:
  mysql-dev:
