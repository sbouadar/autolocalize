# Base locale pour le développement uniquement (MariaDB 10.5, comme sur le VPS).
services:
  db:
    image: mariadb:10.5
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: autolocalize
      MARIADB_USER: autolocalize
      MARIADB_PASSWORD: autolocalize
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb-dev:/var/lib/mysql

volumes:
  mariadb-dev:
