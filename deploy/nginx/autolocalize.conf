# /etc/nginx/conf.d/autolocalize.conf — copié depuis deploy/nginx/ du dépôt.
# autolocalize.net : backend sous /api/, application web cliente à venir sous /.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name autolocalize.net;

    ssl_certificate /etc/letsencrypt/live/autolocalize.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autolocalize.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Backend (Fastify, conteneur Docker sur 127.0.0.1:3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (temps réel, à venir)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;

        client_max_body_size 2m; # logos
    }

    # En attendant l'application web cliente : renvoi vers Traccar.
    location / {
        return 302 https://traccar.autolocalize.net$request_uri;
    }
}

server {
    listen 80;
    server_name autolocalize.net;
    return 301 https://$host$request_uri;
}
