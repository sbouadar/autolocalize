# /etc/nginx/conf.d/autolocalize.conf — copié depuis deploy/nginx/ du dépôt.
# autolocalize.net : application web cliente sous /, backend sous /api/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name autolocalize.net;

    ssl_certificate /etc/letsencrypt/live/autolocalize.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autolocalize.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Backend (Fastify, conteneur Docker sur 127.0.0.1:3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (temps réel, à venir)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;

        client_max_body_size 2m; # logos
    }

    # Application web (export Expo, publiée par deploy/build-web.sh)
    root /var/www/autolocalize;

    # Fichiers générés par Expo, nommés avec une empreinte : cache long.
    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # Page unique : toute route de l'application (/login/demo, /admin…) renvoie index.html,
    # jamais mis en cache pour que chaque déploiement soit pris en compte immédiatement.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

server {
    listen 80;
    server_name autolocalize.net;

    # Redirection dans une location (et non au niveau server) : Certbot peut ainsi
    # insérer sa location de validation HTTP-01 lors des renouvellements.
    location / {
        return 301 https://$host$request_uri;
    }
}
